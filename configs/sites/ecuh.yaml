# East Carolina University Health (ARMD-ECUH).
# File names are relative to <raw-dir>/ecuh/.
#
# Notes
#  - ECUH writes the literal string "Null" for missing values; value_maps turns
#    it into a real missing value (otherwise "Null" acts as a site fingerprint).
#  - The implied-susceptibility file is optional; if present it may be
#    truncated at 1,048,575 rows (an Excel round trip), so absence of an
#    implied row does not mean "no implied result".

site_id: ecuh

file_mappings:
  cohort: "00_microbiology_cultures_cohort.csv"
  demographics: "05_microbiology_cultures_demographics.csv"
  ward_info: "012_microbiology_cultures_ward_info.csv"
  labs: "06_microbiology_cultures_labs.csv"
  vitals: "013_microbiology_cultures_vitals.csv"
  comorbidity: "04_microbiology_cultures_comorbidity.csv"
  prior_med: "010_microbiology_cultures_prior_med.csv"
  priorprocedures: "011_microbiology_cultures_prior_procedures.csv"
  nursing_home_visits: "08_microbiology_cultures_nursing_home_visits.csv"
  prior_infecting_organism: "09_microbiology_cultures_prior_infecting_organism.csv"
  microbial_resistance: "07_microbiology_cultures_microbial_resistance.csv"
  antibiotic_class_exposure: "02_microbiology_cultures_antibiotic_class_exposure.csv"
  antibiotic_subtype_exposure: "03_microbiology_cultures_antibiotic_subtype_exposure.csv"
  adi_scores: "01_microbiology_cultures_adi_scores.csv"
  implied_susceptibility: "014_microbiology_cultures_implied_susceptibility.csv"

column_mappings:
  cohort:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    ordering_mode: "ordering_mode"
    culture_type: "culture_description"
    was_positive: "was_positive"
    organism: "organism"
    antibiotic: "antibiotic"
    susceptibility: "susceptibility"
  demographics:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    age: "age"
    gender: "gender"
  ward_info:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    hosp_ward_IP: "hosp_ward_IP"
    hosp_ward_OP: "hosp_ward_OP"
    hosp_ward_ER: "hosp_ward_ER"
    hosp_ward_ICU: "hosp_ward_ICU"
  labs:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    period_day: "Period_Day"
  vitals:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
  comorbidity:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    comorbidity_component: "comorbidity_component"
    start_days: "comorbidity_component_start_days_culture"
    end_days: "comorbidity_component_end_days_culture"
  prior_med:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    medication_name: "medication_name"
    medication_category: "medication_category"
    time_to_culture: "medication_time_to_culturetime"
  priorprocedures:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    procedure_description: "procedure_description"
    time_to_culture: "procedure_time_to_culturetime"
  nursing_home_visits:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    time_to_culture: "nursing_home_visit_culture"
  prior_infecting_organism:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    prior_organism: "prior_organism"
    time_to_culture: "prior_infecting_organism_days_to_culture"
  microbial_resistance:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    organism: "organism"
    antibiotic: "antibiotic"
    time_to_culture: "resistant_time_to_culturetime"
  antibiotic_class_exposure:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    antibiotic_class: "antibiotic_class"
    time_to_culture: "time_to_culturetime"
  antibiotic_subtype_exposure:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    antibiotic_subtype: "antibiotic_subtype"
    antibiotic_subtype_category: "antibiotic_subtype_category"
    time_to_culture: "medication_time_to_culturetime"
  adi_scores:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    timestamp: "order_time_jittered"
    adi_score: "adi_score"
    adi_state_rank: "adi_state_rank"
  implied_susceptibility:
    patient_id: "anon_id"
    encounter_id: "pat_enc_csn_id_coded"
    order_id: "order_proc_id_coded"
    organism: "organism"
    antibiotic: "antibiotic"
    susceptibility: "susceptibility"
    implied_susceptibility: "implied_susceptibility"

label_policy:
  strategy: single_column

capabilities:
  has_demographics: true
  has_ward_info: true
  has_labs: true
  has_vitals: true
  has_comorbidity: true
  has_prior_med: true
  has_priorprocedures: true
  has_nursing_home_visits: true
  has_prior_infecting_organism: true
  has_microbial_resistance: true
  has_antibiotic_class_exposure: true
  has_antibiotic_subtype_exposure: true
  has_adi_scores: true
  has_implied_susceptibility: true

  ordering_mode_map:
    "inpatient": Inpatient
    "outpatient": Outpatient

  missing_value_tokens: ["Null", "NULL", "null", "NaN", "NA", "N/A", ""]
  value_maps:
    demographics_gender:
      "0": 0
      "1": 1
      "Null": null
    demographics_age:
      "18-24": "18-24"
      "25-34": "25-34"
      "35-44": "35-44"
      "45-54": "45-54"
      "55-64": "55-64"
      "65-74": "65-74"
      "75-84": "75-84"
      "85-89": "85-89"
      "above 90": "above 90"
    nursing_home_visits_nursing_home_visit_culture:
      "Null": null
    adi_scores_adi_score:
      "Null": null
    adi_scores_adi_state_rank:
      "Null": null
